name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 17
          distribution: zulu

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          $scanner = "${{ runner.temp }}\scanner\dotnet-sonarscanner"
          $coveragePaths = @(
            "tests/FurniSpace.API.Tests/TestResults/coverage.opencover.xml",
            "tests/FurniSpace.Application.Tests/TestResults/coverage.opencover.xml",
            "tests/FurniSpace.Domain.Tests/TestResults/coverage.opencover.xml",
            "tests/FurniSpace.Infrastructure.Tests/TestResults/coverage.opencover.xml"
          ) -join ","
          & $scanner begin /k:"DressAnDy_FurniSpace-BE" /o:"dressandy" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.cs.opencover.reportsPaths="$coveragePaths" /d:sonar.cpd.exclusions="src/FurniSpace.Infrastructure/Migrations/**"
          dotnet build FurniSpace.sln -c Release
          dotnet test tests/FurniSpace.Tests.sln --no-build -c Release /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput=./TestResults/coverage.opencover.xml
          $coverageReports = Get-ChildItem -Path . -Recurse -Filter "coverage.opencover.xml"
          if ($coverageReports.Count -eq 0) { throw "No OpenCover reports were generated." }
          $coverageReports | ForEach-Object { Write-Host "Coverage report: $($_.FullName)" }
          & $scanner end /d:sonar.token="$env:SONAR_TOKEN"
