name: SonarQube

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: Release

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 17
          distribution: zulu

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SCANNER_PATH: ${{ runner.temp }}\scanner
          BUILD_CONFIGURATION: ${{ env.BUILD_CONFIGURATION }}
        shell: powershell
        run: |
          & "$env:SCANNER_PATH\dotnet-sonarscanner" begin `
            /k:"DressAnDy_FurniSpace-BE" `
            /o:"dressandy" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" `
            /d:sonar.coverage.exclusions="**/Migrations/**,**/*Tests/**"

          dotnet build FurniSpace.sln -c $env:BUILD_CONFIGURATION

          dotnet test FurniSpace.sln `
            -c $env:BUILD_CONFIGURATION `
            --no-build `
            --settings coverlet.runsettings `
            --collect:"XPlat Code Coverage" `
            --results-directory TestResults/coverage `
            --logger "console;verbosity=normal"

          $coverageFiles = Get-ChildItem -Path TestResults -Recurse -Filter coverage.opencover.xml -ErrorAction SilentlyContinue
          if (-not $coverageFiles) {
            Write-Error "No OpenCover report found under TestResults. SonarQube coverage will stay at 0%."
            exit 1
          }

          Write-Host "Found coverage reports:"
          $coverageFiles | ForEach-Object { Write-Host $_.FullName }

          & "$env:SCANNER_PATH\dotnet-sonarscanner" end /d:sonar.token="$env:SONAR_TOKEN"
