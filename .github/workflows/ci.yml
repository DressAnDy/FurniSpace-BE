name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore FurniSpace.sln

      - name: Build
        run: dotnet build FurniSpace.sln --no-restore -c Release

      - name: Run tests
        run: |
          dotnet test tests/FurniSpace.Domain.Tests/FurniSpace.Domain.Tests.csproj --no-build -c Release
          dotnet test tests/FurniSpace.Application.Tests/FurniSpace.Application.Tests.csproj --no-build -c Release
          dotnet test tests/FurniSpace.Infrastructure.Tests/FurniSpace.Infrastructure.Tests.csproj --no-build -c Release
          dotnet test tests/FurniSpace.API.Tests/FurniSpace.API.Tests.csproj --no-build -c Release

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore FurniSpace.sln

      - name: Build integration tests
        run: dotnet build FurniSpace.sln --no-restore -c Release

      - name: Run Infrastructure integration tests
        run: >
          dotnet test tests/FurniSpace.Infrastructure.IntegrationTests/FurniSpace.Infrastructure.IntegrationTests.csproj
          --no-build
          -c Release
          --filter "Category=Core"
          --logger "trx;LogFileName=infrastructure-integration-tests.trx"
          --results-directory TestResults/integration

      - name: Run Application integration tests
        run: >
          dotnet test tests/FurniSpace.Application.IntegrationTests/FurniSpace.Application.IntegrationTests.csproj
          --no-build
          -c Release
          --filter "Category=Core"
          --logger "trx;LogFileName=application-integration-tests.trx"
          --results-directory TestResults/integration

      - name: Run API integration tests
        run: >
          dotnet test tests/FurniSpace.API.IntegrationTests/FurniSpace.API.IntegrationTests.csproj
          --no-build
          -c Release
          --filter "Category=Core"
          --logger "trx;LogFileName=api-integration-tests.trx"
          --results-directory TestResults/integration

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults/integration
          if-no-files-found: warn
