services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: furnispace-api
    ports:
      - "5000:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - furnispace-network

  postgres:
    image: postgres:16-alpine
    container_name: furnispace-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: furnispace_db
      POSTGRES_USER: furnispace
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furnispace -d furnispace_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - furnispace-network

  redis:
    image: redis:7-alpine
    container_name: furnispace-redis
    env_file: .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - furnispace-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.15
    container_name: furnispace-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - furnispace-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.15
    container_name: furnispace-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - furnispace-network

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:

networks:
  furnispace-network:
    driver: bridge
