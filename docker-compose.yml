services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: furnispace-api
    ports:
      - "${API_HOST_PORT}:${API_CONTAINER_PORT}"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${DB_PASSWORD}
      ConnectionStrings__MigrationConnection: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${DB_PASSWORD}
      Redis__ConnectionString: ${DOCKER_REDIS_CONNECTION}
      ELASTICSEARCH_URL: ${DOCKER_ELASTICSEARCH_URL}
      ELASTICSEARCH_INDEX_PREFIX: ${ELASTICSEARCH_INDEX_PREFIX}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - furnispace-network

  postgres:
    image: postgres:16-alpine
    container_name: furnispace-postgres
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - furnispace-network

  redis:
    image: redis:7-alpine
    container_name: furnispace-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_HOST_PORT}:${REDIS_CONTAINER_PORT}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - furnispace-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.15
    container_name: furnispace-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_HOST_PORT}:${ELASTICSEARCH_CONTAINER_PORT}"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${ELASTICSEARCH_CONTAINER_PORT}/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - furnispace-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.15
    container_name: furnispace-kibana
    environment:
      ELASTICSEARCH_HOSTS: ${KIBANA_ELASTICSEARCH_HOSTS}
    ports:
      - "${KIBANA_HOST_PORT}:${KIBANA_CONTAINER_PORT}"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - furnispace-network

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:

networks:
  furnispace-network:
    driver: bridge
