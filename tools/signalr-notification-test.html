<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FurniSpace SignalR Notification Test</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #172033;
    }

    main {
      max-width: 920px;
      margin: 32px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 20px;
    }

    .panel {
      background: #fff;
      border: 1px solid #d9deea;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 0 0 6px;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #bfc7d8;
      border-radius: 6px;
      padding: 10px 12px;
      font: inherit;
      margin-bottom: 12px;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      margin-right: 8px;
      background: #1f6feb;
      color: #fff;
    }

    button.secondary {
      background: #d8deea;
      color: #172033;
    }

    button.danger {
      background: #d1242f;
    }

    .status {
      display: inline-block;
      margin-left: 8px;
      font-weight: 700;
    }

    .connected {
      color: #1a7f37;
    }

    .disconnected {
      color: #d1242f;
    }

    pre {
      min-height: 260px;
      overflow: auto;
      background: #101828;
      color: #e6edf3;
      border-radius: 8px;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main>
    <h1>FurniSpace SignalR Notification Test</h1>

    <section class="panel">
      <label for="baseUrl">API base URL</label>
      <input id="baseUrl" value="http://localhost:5001">

      <label for="token">Sales/Admin access token</label>
      <textarea id="token" placeholder="Paste access token here"></textarea>

      <button id="connect">Connect</button>
      <button id="disconnect" class="danger">Disconnect</button>
      <button id="clear" class="secondary">Clear Log</button>
      <span id="status" class="status disconnected">Disconnected</span>
    </section>

    <section class="panel">
      <label>Events</label>
      <pre id="log"></pre>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script>
    let connection = null;

    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const baseUrlEl = document.getElementById("baseUrl");
    const tokenEl = document.getElementById("token");

    function setStatus(text, isConnected) {
      statusEl.textContent = text;
      statusEl.className = "status " + (isConnected ? "connected" : "disconnected");
    }

    function log(message, data) {
      const time = new Date().toLocaleTimeString();
      const value = data === undefined ? message : message + "\n" + JSON.stringify(data, null, 2);
      logEl.textContent += `[${time}] ${value}\n\n`;
      logEl.scrollTop = logEl.scrollHeight;
      console.log(message, data ?? "");
    }

    async function connect() {
      const baseUrl = baseUrlEl.value.trim().replace(/\/$/, "");
      const token = tokenEl.value.trim();

      if (!baseUrl) {
        log("API base URL is required.");
        return;
      }

      if (!token) {
        log("Sales/Admin access token is required.");
        return;
      }

      if (connection) {
        await connection.stop();
        connection = null;
      }

      connection = new signalR.HubConnectionBuilder()
        .withUrl(`${baseUrl}/hubs/notifications`, {
          accessTokenFactory: () => token
        })
        .withAutomaticReconnect()
        .build();

      connection.on("project.request.submitted", payload => {
        log("Received event: project.request.submitted", payload);
      });

      connection.on("project.request.accepted", payload => {
        log("Received event: project.request.accepted", payload);
      });

      connection.on("project.more_information.requested", payload => {
        log("Received event: project.more_information.requested", payload);
      });

      connection.on("project.basic_information.updated", payload => {
        log("Received event: project.basic_information.updated", payload);
      });

      connection.on("project.status.changed", payload => {
        log("Received event: project.status.changed", payload);
      });

      connection.on("project.designer.assigned", payload => {
        log("Received event: project.designer.assigned", payload);
      });

      connection.on("notification.created", payload => {
        log("Received event: notification.created", payload);
      });

      connection.onreconnecting(error => {
        setStatus("Reconnecting", false);
        log("Connection reconnecting.", error?.message);
      });

      connection.onreconnected(connectionId => {
        setStatus("Connected", true);
        log("Connection reconnected.", { connectionId });
      });

      connection.onclose(error => {
        setStatus("Disconnected", false);
        log("Connection closed.", error?.message);
      });

      try {
        await connection.start();
        setStatus("Connected", true);
        log("Connected to SignalR hub.");
      } catch (error) {
        setStatus("Disconnected", false);
        log("Connection failed.", error?.message || error);
      }
    }

    async function disconnect() {
      if (!connection) {
        return;
      }

      await connection.stop();
      connection = null;
      setStatus("Disconnected", false);
      log("Disconnected manually.");
    }

    document.getElementById("connect").addEventListener("click", connect);
    document.getElementById("disconnect").addEventListener("click", disconnect);
    document.getElementById("clear").addEventListener("click", () => {
      logEl.textContent = "";
    });
  </script>
</body>
</html>
